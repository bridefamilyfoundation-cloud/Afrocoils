<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AfroCoils carousels</title>
<!--
  One slide of one carousel: index.html?section=<slug>&slide=<1-6>.
  Everything it says and shows comes from data.js; every picture is a
  crop of a real screen from captures/. Nothing loads from another origin.
-->
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:500;src:url(assets/plus-jakarta-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:600;src:url(assets/plus-jakarta-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:700;src:url(assets/plus-jakarta-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:800;src:url(assets/plus-jakarta-sans-latin-800-normal.woff2) format('woff2')}
:root{
  --cream:#E8D5C0; --orange:#E2583E; --chocolate:#5A2108; --espresso:#3F1708;
  /* Tints: the brand colours mixed toward white, as the app's tokens are. */
  --cream-light:#F6EBDF; --card:#FBF4EC; --peach:#F6C9C1; --peach-deep:#F1B1A5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--ink)}

/* Themes: where a slide sits in the four colours. */
.t-cream{--bg:linear-gradient(170deg,var(--cream-light),var(--cream) 55%,var(--peach));--ink:var(--chocolate);--soft:#6E4126;--chip:var(--espresso);--chip-ink:var(--cream-light)}
.t-light{--bg:var(--cream-light);--ink:var(--chocolate);--soft:#6E4126;--chip:var(--espresso);--chip-ink:var(--cream-light)}
.t-peach{--bg:linear-gradient(165deg,var(--peach),var(--peach-deep));--ink:var(--espresso);--soft:var(--chocolate);--chip:var(--espresso);--chip-ink:var(--cream-light)}
.t-orange{--bg:var(--orange);--ink:#fff;--soft:#fff;--chip:#fff;--chip-ink:var(--espresso)}
.t-chocolate{--bg:var(--chocolate);--ink:var(--cream-light);--soft:var(--cream);--chip:var(--cream-light);--chip-ink:var(--espresso)}
.t-espresso{--bg:var(--espresso);--ink:var(--cream-light);--soft:var(--cream);--chip:var(--cream-light);--chip-ink:var(--espresso)}

h1{font-weight:800;font-size:132px;line-height:1.0;letter-spacing:-0.035em;text-wrap:balance}
h2{font-weight:800;font-size:72px;line-height:1.08;letter-spacing:-0.03em;text-wrap:balance}
p{font-weight:500;font-size:38px;line-height:1.36;color:var(--soft);text-wrap:pretty}

/* Footer: the mark, the section's name and where you are in the set. */
.foot{position:absolute;left:72px;right:72px;bottom:56px;display:flex;align-items:center;gap:20px;z-index:5}
.foot .mark{width:64px;height:64px;border-radius:50%;background:var(--cream-light);padding:6px;object-fit:contain;box-shadow:0 6px 18px -8px rgb(63 23 8 / .5)}
.foot .name{font-weight:700;font-size:30px;flex:1}
/* Where to find the app: on every slide, so a slide shared alone still says. */
.foot .site{font-weight:800;font-size:30px;letter-spacing:-0.01em}
.foot .count{font-weight:700;font-size:28px;background:var(--chip);color:var(--chip-ink);padding:8px 22px;border-radius:999px;font-variant-numeric:tabular-nums}
.swipe{display:flex;align-items:center;gap:12px;font-weight:700;font-size:30px;margin-right:8px}
.swipe svg{width:44px;height:44px}

/* A piece of a real screen. */
.shot{position:absolute;overflow:hidden;background:linear-gradient(180deg,var(--cream-light),var(--cream) 60%,var(--peach));box-shadow:0 40px 80px -30px rgb(63 23 8 / .55),0 12px 28px -14px rgb(63 23 8 / .35)}
.shot img{position:absolute;left:0;display:block}
.shot.phone{border:12px solid var(--espresso);border-radius:64px}
.shot.card{border-radius:44px}

/* Layouts */
.cover .text{position:absolute;left:72px;right:72px;top:96px}
.cover h1{margin-bottom:36px}
.cover p{font-size:42px;max-width:860px}

.top .text{position:absolute;left:72px;right:72px;top:84px}
.top h2{margin-bottom:22px}

.bottom .text{position:absolute;left:72px;right:72px;bottom:176px}
.bottom h2{margin-bottom:22px}

.side .text{position:absolute;left:72px;width:470px;top:120px}
.side h2{font-size:68px;margin-bottom:26px}
.side p{font-size:36px}

.end{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center}
.end img{width:480px}
/* The call to action is the landing page's own button and promise, and its address. */
.end .cta{display:flex;align-items:center;gap:20px;margin-top:28px;background:var(--orange);color:#fff;font-weight:800;font-size:50px;letter-spacing:-0.01em;padding:30px 60px;border-radius:999px;box-shadow:0 24px 44px -20px rgb(63 23 8 / .55)}
.end .cta svg{width:52px;height:52px}
.end .url{font-weight:800;font-size:76px;letter-spacing:-0.03em;color:var(--espresso)}
.end .trial{font-weight:600;font-size:36px;color:#6E4126}
.end .tag{font-weight:700;font-size:46px;letter-spacing:-0.01em;color:var(--chocolate)}
</style>
</head>
<body>
<div id="root"></div>
<script src="data.js"></script>
<script>
const q = new URLSearchParams(location.search)
const section = CAROUSELS.find((c) => c.slug === q.get('section')) ?? CAROUSELS[0]
const index = Math.max(1, Math.min(section.slides.length, Number(q.get('slide') ?? 1)))
const slide = section.slides[index - 1]
// The landing page's address, its download button and its trial line, word for word.
const SITE = 'afrocoils.app'
const CTA = 'Download for Android'
const TRIAL = 'Try it free for three days.'
const SCREEN = 412 // CSS px the screens were captured at

/** A crop of a capture: `y` and `h` are in the screen's own CSS px. */
function shot(s) {
  const scale = s.w / SCREEN
  const radius = s.kind === 'phone' ? '' : ''
  const border = s.kind === 'phone' ? 24 : 0
  return `<div class="shot ${s.kind ?? 'card'}" style="left:${s.x}px;top:${s.top}px;width:${s.w + border}px;height:${Math.round(s.h * scale) + border}px${radius}">
    <img src="captures/${s.img}.png" style="width:${s.w}px;top:${-Math.round(s.y * scale)}px" alt="">
  </div>`
}

const foot = `<div class="foot">
  <img class="mark" src="assets/afro-mark.webp" alt="">
  <span class="name">${section.title}</span>
  <span class="site">${SITE}</span>
  ${slide.layout === 'cover' ? `<span class="swipe">Swipe<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>` : ''}
  <span class="count">${index}/${section.slides.length}</span>
</div>`

let html
if (slide.layout === 'end') {
  html = `<div class="slide end t-light"><img src="assets/afro-hero.webp" alt="AfroCoils"><div class="tag">AfroCoils — Celebrating Every Coil.</div>
    <div class="cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>${CTA}</div>
    <div class="url">${SITE}</div>
    <div class="trial">${TRIAL}</div></div>`
} else {
  html = `<div class="slide ${slide.layout} t-${slide.theme ?? 'cream'}">
    <div class="text">${slide.layout === 'cover' ? `<h1>${slide.head}</h1>` : `<h2>${slide.head}</h2>`}${slide.body ? `<p>${slide.body}</p>` : ''}</div>
    ${(slide.shots ?? []).map(shot).join('')}
    ${foot}
  </div>`
}
document.getElementById('root').innerHTML = html
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))])
</script>
</body>
</html>
