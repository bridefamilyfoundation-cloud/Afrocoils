<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hair SOS — how to get around</title>
<!--
  Finding your way around Hair SOS, at 1080 x 1920.

  Every frame is worked out from the time alone: window.seek(seconds)
  draws that exact moment. Opened normally it loops; with ?render in the
  address it waits for seek (render.cjs steps it frame by frame).

  The phone screen is the real screen: captures/ holds each page's
  content and its fixed chrome, shot from the running app by capture.cjs,
  and the screens change in the order real taps change them. Every tap
  ring sits on its control's own bounding box, read from the app at
  capture time (captures/marks.json, copied into MARKS below). The
  captions are the app's own button and screen names. Four colours, one
  face, nothing loaded from another origin.
-->
<style>
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 500; src: url('assets/plus-jakarta-sans-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 600; src: url('assets/plus-jakarta-sans-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 700; src: url('assets/plus-jakarta-sans-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 800; src: url('assets/plus-jakarta-sans-latin-800-normal.woff2') format('woff2'); }

  :root {
    --cream: #E8D5C0;
    --orange: #E2583E;
    --chocolate: #5A2108;
    --espresso: #3F1708;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--espresso); }
  body { overflow: hidden; }

  #stage {
    position: absolute; left: 0; top: 0;
    width: 1080px; height: 1920px; overflow: hidden;
    transform-origin: 0 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--chocolate);
    background: var(--cream);
  }
  .bg { position: absolute; inset: 0; }
  /* Cream to peach: the orange at low strength over the cream. */
  #bg-wash { background: linear-gradient(180deg, rgb(255 255 255 / 0.42) 0%, rgb(255 255 255 / 0.12) 45%, rgb(226 88 62 / 0.26) 100%); }
  #bg-espresso { background: var(--espresso); }
  #bg-orange { background: var(--orange); }
  .disc { position: absolute; border-radius: 50%; background: rgb(226 88 62 / 0.10); }

  /* ---- The phone ---- */
  #phone {
    position: absolute; left: 0; top: 0;
    width: 412px; height: 915px;
    transform-origin: 0 0;
    border-radius: 46px;
    box-shadow: 0 0 0 5px var(--espresso), 0 30px 60px -18px rgb(63 23 8 / 0.45);
    background: var(--cream);
  }
  #screen { position: absolute; inset: 0; border-radius: 46px; overflow: hidden; }
  /* The app's own page wash, drawn here because the captures are transparent. */
  #wash { position: absolute; inset: 0; background: linear-gradient(180deg, #F6EBDF 0%, #F1E3D4 45%, #F6C9C1 100%); }
  .page { position: absolute; left: 0; top: 0; width: 412px; transform-origin: 0 0; }
  /* The app bar blurs what scrolls under it; the capture alone cannot. */
  #bar { position: absolute; left: 0; top: 0; width: 412px; height: 64px; background: rgb(246 235 223 / 0.55); backdrop-filter: blur(12px); }
  .chrome { position: absolute; left: 0; top: 0; width: 412px; height: 915px; }

  /* The tap: a ring that closes on the control and lets go. Cream with
     an espresso edge, so it reads on a light card and on a dark pill. */
  #tap {
    position: absolute; left: 0; top: 0; width: 56px; height: 56px;
    margin: -28px 0 0 -28px; border-radius: 50%;
    border: 3px solid #FBF4EC;
    box-shadow: 0 0 0 1.5px var(--espresso), inset 0 0 0 1.5px var(--espresso);
    background: rgb(226 88 62 / 0.28);
    opacity: 0;
  }

  /* ---- Captions ---- */
  .cap { position: absolute; left: 0; width: 1080px; padding: 0 72px; }
  .cap h1, .cap h2, .cap p { letter-spacing: -0.025em; text-wrap: balance; }

  #c1 { top: 250px; text-align: center; }
  #c1 img { height: 250px; width: auto; }
  #c1 h1 { margin-top: 70px; font-size: 150px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; color: var(--espresso); }
  #c1 p { margin-top: 36px; font-size: 50px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }

  #c2 { top: 96px; text-align: center; }
  #c2 h2 { font-size: 74px; line-height: 1.08; font-weight: 800; color: var(--espresso); }

  #c3 { top: 84px; }
  #c3 h2 { font-size: 104px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; color: var(--espresso); }
  #c3 p { margin-top: 22px; font-size: 54px; line-height: 1.2; font-weight: 700; color: var(--orange); -webkit-text-stroke: 0; }
  #c3 p { color: var(--chocolate); }

  #c4 { top: 1560px; padding: 0 56px; }
  #c4 .panel { border-radius: 56px; background: var(--cream); color: var(--espresso); padding: 56px 64px 62px; }
  #c4 h2 { font-size: 80px; line-height: 1.06; font-weight: 800; }

  #c5 { top: 1470px; text-align: center; }
  #c5 h2 { font-size: 88px; line-height: 1.06; font-weight: 800; color: var(--espresso); }

  #c6 { top: 100px; color: #fff; }
  #c6 h2 { font-size: 84px; line-height: 1.06; font-weight: 800; }

  #c7 { top: 1650px; text-align: center; padding: 0 40px; }
  #c7 span { display: inline-block; border-radius: 999px; background: var(--espresso); color: var(--cream); padding: 30px 52px 34px; font-size: 46px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; box-shadow: 0 24px 48px -14px rgb(63 23 8 / 0.55); }

  #c8 { top: 560px; text-align: center; }
  #c8 img { height: 470px; width: auto; }
  #c8 p { margin-top: 64px; font-size: 54px; line-height: 1.25; font-weight: 700; letter-spacing: -0.015em; color: var(--espresso); }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bg-wash"></div>
  <div class="disc" id="d1" style="width:900px;height:900px;left:-380px;top:-260px"></div>
  <div class="disc" id="d2" style="width:760px;height:760px;left:620px;top:1320px"></div>
  <div class="bg" id="bg-espresso"></div>
  <div class="bg" id="bg-orange"></div>

  <div id="phone">
    <div id="screen">
      <div id="wash"></div>
      <img class="page" id="p-sos" src="captures/sos.png" alt="" />
      <img class="page" id="p-quick0" src="captures/quick0.png" alt="" />
      <img class="page" id="p-quick1" src="captures/quick1.png" alt="" />
      <img class="page" id="p-care" src="captures/care.png" alt="" />
      <div id="bar"></div>
      <img class="chrome" id="ch-sos" src="captures/chrome-sos.png" alt="" />
      <img class="chrome" id="ch-care" src="captures/chrome-care.png" alt="" />
      <div id="tap"></div>
    </div>
  </div>

  <div class="cap" id="c1">
    <img src="assets/afro-hero.webp" alt="AfroCoils" />
    <h1>Hair SOS</h1>
    <p>What&rsquo;s your emergency?</p>
  </div>
  <div class="cap" id="c2"><h2>Tap &ldquo;Need a quick&nbsp;style?&rdquo;</h2></div>
  <div class="cap" id="c3"><h2>Two ways in</h2><p>Tap &ldquo;Quick Hairstyle&rdquo;.</p></div>
  <div class="cap" id="c4"><div class="panel"><h2>Pick how much time you&nbsp;have.</h2></div></div>
  <div class="cap" id="c5"><h2>Come back with the SOS&nbsp;tab.</h2></div>
  <div class="cap" id="c6"><h2>Tap &ldquo;Get Started&rdquo; for Hair&nbsp;Care.</h2></div>
  <div class="cap" id="c7"><span>&ldquo;Something is wrong&rdquo; is in Hair&nbsp;Care.</span></div>
  <div class="cap" id="c8">
    <img src="assets/afro-hero.webp" alt="AfroCoils" />
    <p>AfroCoils — Celebrating Every Coil.</p>
  </div>
</div>

<script>
const DURATION = 39.4
const $ = (id) => document.getElementById(id)

/*
 * Where the controls are, from captures/marks.json (CSS px of the
 * 412-wide screen). Content controls are in page coordinates and move
 * with the scroll; the tab is fixed chrome, in viewport coordinates.
 */
const MARKS = {
  getStarted: { x: 52, y: 715, w: 181, h: 56 },
  quickLink: { x: 251, y: 735, w: 109, h: 16 },
  doorsScroll: 682, // where "Need a quick style?" really lands
  doorQuick: { x: 20, y: 977, w: 372, h: 96 },
  band: { x: 137, y: 266, w: 117, h: 36 }, // "15–20 min"
  tabSos: { x: 22, y: 849, w: 109, h: 48 },
  wrong: { x: 20, y: 1762, w: 372, h: 140 }, // "Something is wrong"
}
const mid = (b) => ({ x: b.x + b.w / 2, y: b.y + b.h / 2 })

/* ---- Time helpers: everything is a pure function of t ---- */
const clamp = (x) => Math.max(0, Math.min(1, x))
const span = (t, a, b) => clamp((t - a) / (b - a))
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
const out = (x) => 1 - Math.pow(1 - x, 4)
const lerp = (a, b, x) => a + (b - a) * x
/** 0 → 1 over [a, a+d], held, then 1 → 0 over [b-d2, b]. */
const window01 = (t, a, b, d = 0.6, d2 = 0.4) => Math.min(span(t, a, a + d), 1 - span(t, b - d2, b))

/* When each tap lands, and when the screen it opens has arrived. */
const T = {
  tapQuickLink: 7.3,
  tapDoor: 12.9, toQuick: [13.15, 13.6],
  tapBand: 16.2, toBand: [16.35, 16.75],
  tapTab: 23.7, toSos: [23.95, 24.4],
  tapStart: 28.1, toCare: [28.35, 28.8],
}

/*
 * The camera: where the phone is at a moment — its scale, the canvas x
 * of its centre and the canvas y of its top edge. Between two keys the
 * move is eased; a pair of keys inside one beat is that beat's push-in.
 */
const CAM = [
  // 1. Title: the phone rises and peeks from the foot.
  { t: 0.0, s: 1.75, x: 540, y: 1960 },
  { t: 0.5, s: 1.75, x: 540, y: 1960 },
  { t: 1.9, s: 1.75, x: 540, y: 1330, ease: out },
  { t: 3.3, s: 1.78, x: 540, y: 1310, ease: null },
  // 2. The front page, whole.
  { t: 4.3, s: 1.68, x: 540, y: 330 },
  { t: 9.0, s: 1.72, x: 540, y: 322, ease: null },
  // 3. The two doors.
  { t: 9.9, s: 2.2, x: 540, y: 420 },
  { t: 13.3, s: 2.25, x: 540, y: 408, ease: null },
  // 4. Quick Hairstyle, on espresso.
  { t: 14.3, s: 2.0, x: 540, y: 96 },
  { t: 20.7, s: 2.04, x: 540, y: 84, ease: null },
  // 5. The tab bar.
  { t: 21.7, s: 2.2, x: 540, y: -660 },
  { t: 24.5, s: 2.24, x: 540, y: -676, ease: null },
  // 6. The front page again, on orange.
  { t: 25.5, s: 1.75, x: 540, y: 372 },
  { t: 28.9, s: 1.78, x: 540, y: 362, ease: null },
  // 7. Hair Care.
  { t: 29.8, s: 2.1, x: 540, y: -150 },
  { t: 35.0, s: 2.14, x: 540, y: -162, ease: null },
  // 8. The phone leaves; the logo stays.
  { t: 36.0, s: 2.0, x: 540, y: 1990 },
  { t: 39.4, s: 2.0, x: 540, y: 1990 },
]

function camera(t) {
  let i = 0
  while (i < CAM.length - 2 && t >= CAM[i + 1].t) i++
  const a = CAM[i], b = CAM[i + 1]
  const ease = b.ease === null ? (x) => x : b.ease || inOut
  const k = ease(span(t, a.t, b.t))
  return { s: lerp(a.s, b.s, k), x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) }
}

/** A caption: fades and settles in, fades out. `dy` is the settle distance. */
function caption(el, t, a, b, dy = 36) {
  const v = window01(t, a, b)
  const settle = out(span(t, a, a + 0.9))
  el.style.opacity = v
  el.style.transform = `translateY(${(1 - settle) * dy}px)`
  el.style.filter = v < 1 && t < a + 0.6 ? `blur(${(1 - v) * 8}px)` : 'none'
}

/** How far each page has scrolled, in screen px. */
function scrolls(t) {
  return {
    // "Need a quick style?" scrolls to the doors; the SOS tab opens the page at its top.
    sos: t < 20 ? lerp(0, MARKS.doorsScroll, inOut(span(t, T.tapQuickLink + 0.2, T.tapQuickLink + 1.5))) : 0,
    quick: lerp(0, 500, inOut(span(t, 17.5, 20.5))),
    care: lerp(0, 1330, inOut(span(t, 30.3, 33.3))),
  }
}

/** The taps: when, and where on the screen at that moment. */
function taps(sc) {
  const fixed = (b) => mid(b)
  const page = (b, scroll) => ({ x: mid(b).x, y: mid(b).y - scroll })
  return [
    { t: T.tapQuickLink, ...page(MARKS.quickLink, 0) },
    { t: T.tapDoor, ...page(MARKS.doorQuick, MARKS.doorsScroll) },
    { t: T.tapBand, ...page(MARKS.band, 0) },
    { t: T.tapTab, ...fixed(MARKS.tabSos) },
    { t: T.tapStart, ...page(MARKS.getStarted, 0) },
  ]
}

function seek(t) {
  t = Math.max(0, Math.min(DURATION, t))

  /* Backgrounds */
  $('bg-espresso').style.opacity = window01(t, 13.4, 21.6, 0.9, 0.9)
  $('bg-orange').style.opacity = Math.min(span(t, 24.6, 25.5), 1 - span(t, 28.9, 29.8))
  $('d1').style.transform = `translate(${t * 5}px, ${t * 7}px)`
  $('d2').style.transform = `translate(${-t * 6}px, ${-t * 9}px)`

  /* Phone */
  const c = camera(t)
  $('phone').style.transform = `translate(${c.x - 206 * c.s}px, ${c.y}px) scale(${c.s})`

  /* Which screen is showing. A tap opens the next one a beat later; the
     captures are transparent, so each change is a true crossfade, and a
     screen that is a new address also settles up into place. */
  const toQuick = inOut(span(t, ...T.toQuick))
  const toBand = inOut(span(t, ...T.toBand))
  const toSos = inOut(span(t, ...T.toSos))
  const toCare = inOut(span(t, ...T.toCare))
  const sc = scrolls(t)
  const arrive = (k) => (1 - k) * 18

  const sosOn = t < 20 ? 1 - toQuick : toSos * (1 - toCare)
  $('p-sos').style.opacity = sosOn
  $('p-sos').style.transform = `translateY(${-sc.sos + (t < 20 ? 0 : arrive(toSos))}px)`
  $('p-quick0').style.opacity = toQuick * (1 - toBand)
  $('p-quick0').style.transform = `translateY(${-sc.quick + arrive(toQuick)}px)`
  $('p-quick1').style.opacity = toBand * (1 - toSos)
  $('p-quick1').style.transform = `translateY(${-sc.quick}px)`
  $('p-care').style.opacity = toCare
  $('p-care').style.transform = `translateY(${-sc.care + arrive(toCare)}px)`
  /* The SOS tab is lit on the front page and inside Quick Hairstyle;
     Hair Care is its own section, so nothing in the bar is lit there. */
  $('ch-sos').style.opacity = 1 - toCare
  $('ch-care').style.opacity = toCare

  /* The tap ring: closes on the control, presses, lets go. */
  const ring = $('tap')
  ring.style.opacity = 0
  for (const tap of taps(sc)) {
    const lead = t - tap.t
    if (lead < -0.55 || lead > 0.32) continue
    const closing = out(span(lead, -0.55, -0.15))
    const press = inOut(span(lead, -0.12, 0)) * (1 - span(lead, 0, 0.3))
    const release = out(span(lead, 0, 0.32))
    ring.style.opacity = Math.min(span(lead, -0.55, -0.35), 1 - span(lead, 0.08, 0.32))
    ring.style.transform = `translate(${tap.x}px, ${tap.y}px) scale(${lerp(1.5, 1, closing) - press * 0.22 + release * 0.35})`
  }

  /* Captions */
  caption($('c1'), t, 0.2, 3.6)
  caption($('c2'), t, 4.5, 9.2)
  caption($('c3'), t, 10.0, 13.5)
  caption($('c4'), t, 14.4, 20.9, 60)
  caption($('c5'), t, 21.9, 24.7, 40)
  caption($('c6'), t, 25.6, 29.0)
  caption($('c7'), t, 31.8, 35.2, 40)
  caption($('c8'), t, 35.8, 41, 30)
}
window.seek = seek
window.DURATION = DURATION

/* Fit the stage to the window when watched; 1:1 when rendered. */
const rendering = location.search.includes('render')
function fit() {
  const k = rendering ? 1 : Math.min(innerWidth / 1080, innerHeight / 1920)
  $('stage').style.transform = `scale(${k})`
  $('stage').style.left = rendering ? '0' : `${(innerWidth - 1080 * k) / 2}px`
}
fit()
addEventListener('resize', fit)

seek(0)
if (!rendering) {
  const start = performance.now()
  const tick = (now) => {
    seek(((now - start) / 1000) % DURATION)
    requestAnimationFrame(tick)
  }
  requestAnimationFrame(tick)
}
</script>
</body>
</html>
